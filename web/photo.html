<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d22">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛵</text></svg>">
  <title>영산강 포토부스 사진</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .photo-page {
      position: relative;
      max-width: 520px; margin: 0 auto;
      padding: 28px 16px calc(36px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 18px;
    }
    .photo-page header p { margin: 0 0 4px; color: var(--sail-hi); font-weight: 600; font-size: .95rem; }
    .photo-page h1 {
      margin: 0; font-family: var(--display); font-weight: 700;
      font-size: 1.85rem; letter-spacing: -.03em; line-height: 1.25;
    }
    .photo-page .shot {
      width: 100%; border-radius: 14px;
      box-shadow: 0 40px 70px -24px rgba(0, 0, 0, .75), 0 8px 20px rgba(0, 0, 0, .25);
      animation: print 1.6s var(--ease) both;
    }
    .photo-page .actions { display: grid; gap: 10px; }
    .photo-page .actions .btn { width: 100%; text-decoration: none; }
    .photo-page .tip { margin: 0; color: var(--text-dim); font-size: .9rem; text-align: center; }
    .photo-page .ver { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .photo-page .ver-label { width: 100%; margin: 4px 0 -2px; color: var(--text-faint); font-size: .8rem; }
    .photo-page .ver button {
      padding: 9px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .06);
      color: var(--text-dim); font: inherit; font-size: .9rem; font-weight: 600;
    }
    .photo-page .ver button[aria-pressed="true"] {
      background: var(--sail-hi); border-color: transparent; color: #11242a;
    }
    .photo-page .ver button.fx-idle::before { content: '✨ '; }
    .photo-page .ver button.fx-pending { opacity: .7; cursor: progress; }
    .photo-page .ver button:disabled { opacity: .45; cursor: default; }
    .photo-page .ai-note { margin: 10px 0 0; color: var(--text-dim); font-size: .85rem; text-align: center; }
    .photo-page .missing { padding: 40px 0; }
    .photo-page .missing p { color: var(--text-dim); }
  </style>
</head>
<body>
<div class="ambient" id="ambient" aria-hidden="true"><img alt=""></div>
<main class="photo-page" data-state="{{STATE}}" data-sid="{{SID}}">
  <header>
    <p>2026 나주영산강축제</p>
    <h1 id="title">오늘의 영산강 사진</h1>
  </header>

  <div id="ready" hidden>
    <div class="ver" id="ver" hidden role="group" aria-label="사진 고르기"></div>
    <img class="shot" id="shot" alt="포토부스에서 찍은 사진">
    <p class="ai-note" id="aiNote" hidden></p>
    <div class="actions" style="margin-top:18px">
      <button class="btn btn-sail btn-lg" id="saveBtn" type="button">사진 저장하기</button>
      <button class="btn btn-glass" id="saveShotBtn" type="button">프레임 없는 사진 저장</button>
    </div>
    <p class="tip" id="tip" style="margin-top:14px">저장을 누르면 사진 앱에 바로 담을 수 있어요.</p>
  </div>

  <div class="missing" id="missing" hidden>
    <p>사진을 찾을 수 없어요. 보관 기간이 지나 삭제됐거나 주소가 잘못됐어요. 부스에서 QR코드를 다시 찍어 주세요.</p>
  </div>
</main>
<script>
  const page = document.querySelector('.photo-page');
  const sid = page.dataset.sid;
  if (page.dataset.state !== 'ready' || !sid) {
    document.getElementById('missing').hidden = false;
    document.getElementById('title').textContent = '사진이 없어요';
  } else {
    const $ = (s) => document.querySelector(s);
    const shot = $('#shot');
    const note = $('#aiNote');
    const tip = $('#tip');
    const amb = document.querySelector('#ambient img');
    // base: 부스에서 고른 사진, light: AI 빛 보정, 그 밖: 휴대폰에서 누른 AI 효과
    const versions = { base: { final: `/media/${sid}/final.jpg`, photo: `/media/${sid}/shot.jpg` } };
    const fxState = {};   // 효과 id -> idle | pending | failed | limit
    let catalog = [];
    let cur = 'base';
    let lightPending = false;
    let wanted = null;    // 방금 누른 효과. 다 만들어지면 바로 보여 준다
    const files = {};     // 공유 시트로 바로 저장할 수 있게 미리 받아 둔다

    $('#ready').hidden = false;
    amb.onload = () => amb.classList.add('on');

    const NOTES = {
      light: 'AI가 그곳의 빛에 맞춰 다시 비춘 사진이에요. 얼굴은 그대로예요.',
      fx: 'AI가 새로 그린 사진이라 얼굴이 조금 달라질 수 있어요. 기본 사진도 그대로 있어요.',
    };

    const canShareFiles = (f) => {
      try { return !!navigator.canShare && navigator.canShare({ files: [f] }); } catch { return false; }
    };

    // 휴대폰은 공유 시트로 '이미지 저장'이 가장 확실하다. 안 되면 바로 내려받기로 넘어간다
    async function save(url, name) {
      const file = files[url];
      if (file && canShareFiles(file)) {
        try {
          await navigator.share({ files: [file], title: '영산강 포토부스' });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;   // 사용자가 닫음
        }
      }
      const a = document.createElement('a');
      a.href = `${url}?download=1`;
      a.download = name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function prefetch(url, name) {
      if (files[url] !== undefined) return;
      files[url] = null;
      fetch(url).then((r) => r.blob()).then((blob) => {
        const f = new File([blob], name, { type: 'image/jpeg' });
        files[url] = canShareFiles(f) ? f : null;
        if (files[url]) tip.textContent = '저장을 누르면 ‘이미지 저장’을 고를 수 있어요.';
      }).catch(() => {});
    }

    function setVersion(v) {
      if (!versions[v]) return;
      cur = v;
      const u = versions[v];
      shot.src = u.final;
      amb.src = u.final;             // 내 사진의 빛이 화면 전체에 번지게
      note.textContent = v === 'base' ? '' : (v === 'light' ? NOTES.light : NOTES.fx);
      note.hidden = v === 'base';
      renderChips();
      prefetch(u.final, 'yeongsangang.jpg');
    }

    // 사진 고르기 단추: 기본 · 빛 보정(준비되면) · AI 효과(누르면 그때 만든다)
    function renderChips() {
      const row = $('#ver');
      row.innerHTML = '';
      const add = (id, label, state) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.ver = id;
        b.setAttribute('aria-pressed', String(cur === id));
        b.className = state === 'ready' ? '' : `fx-${state}`;
        b.textContent = state === 'pending' ? `${label} 만드는 중…`
          : state === 'failed' ? `${label} 다시`
            : state === 'limit' ? `${label} (오늘 마감)` : label;
        b.disabled = state === 'pending' || state === 'limit';
        b.addEventListener('click', () => (state === 'ready' ? setVersion(id) : makeEffect(id)));
        row.appendChild(b);
      };
      add('base', '기본', 'ready');
      if (versions.light) add('light', '빛 보정', 'ready');
      if (catalog.length) {
        const lab = document.createElement('p');
        lab.className = 'ver-label';
        lab.textContent = 'AI로 바꿔 보기 (누르면 만들어요)';
        row.appendChild(lab);
        catalog.forEach((e) => add(e.id, e.name, versions[e.id] ? 'ready' : (fxState[e.id] || 'idle')));
      }
      row.hidden = row.querySelectorAll('button').length <= 1;
    }

    let agreed = false;
    async function makeEffect(id) {
      // 사진이 바깥으로 나가는 순간이므로 처음 한 번은 꼭 묻는다
      if (!agreed && !confirm('AI 효과를 만들려면 이 사진이 외부 AI 서비스(OpenAI)로 전송돼요. 계속할까요?')) return;
      agreed = true;
      wanted = id;
      fxState[id] = 'pending';
      renderChips();
      note.textContent = 'AI가 그리고 있어요. 20초쯤 걸려요. 화면을 닫지 말고 기다려 주세요.';
      note.hidden = false;
      try {
        const res = await (await fetch(`/p/${sid}/fx/${id}`, { method: 'POST' })).json();
        apply({ effects: { [id]: res } });
      } catch {
        fxState[id] = 'failed';
        renderChips();
      }
      poll();
    }

    function apply(res) {
      if (res.state === 'ready' && !versions.light) {
        versions.light = { final: res.final || res.photo, photo: res.photo };
      }
      lightPending = res.state === 'pending';
      if (res.catalog) catalog = res.catalog;
      Object.entries(res.effects || {}).forEach(([id, st]) => {
        if (st.state === 'ready') {
          versions[id] = { final: st.final, photo: st.photo };
          delete fxState[id];
        } else {
          fxState[id] = st.state === 'pending' ? 'pending' : st.state === 'limit' ? 'limit' : 'failed';
        }
      });
      if (wanted && versions[wanted]) {
        const id = wanted;
        wanted = null;
        setVersion(id);
        return;
      }
      renderChips();
    }

    // 만드는 중인 것이 있는 동안만 물어본다
    let polling = false;
    let tries = 0;
    async function poll() {
      if (polling) return;
      polling = true;
      tries = 0;
      while (tries++ < 80) {
        let res;
        try {
          res = await (await fetch(`/p/${sid}/ai`, { cache: 'no-store' })).json();
        } catch { await new Promise((r) => setTimeout(r, 5000)); continue; }
        apply(res);
        const busy = lightPending || Object.values(fxState).includes('pending');
        if (!busy) break;
        await new Promise((r) => setTimeout(r, 3000));
      }
      polling = false;
    }

    $('#saveBtn').addEventListener('click', () => save(versions[cur].final, 'yeongsangang_frame.jpg'));
    $('#saveShotBtn').addEventListener('click', () => save(versions[cur].photo, 'yeongsangang_photo.jpg'));
    if (!navigator.canShare) tip.textContent = '저장이 안 되면 사진을 길게 눌러 ‘사진 앱에 저장’을 고르세요.';
    setVersion('base');
    poll();
  }
</script>
</body>
</html>
