<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d22">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛵</text></svg>">
  <title>영산강 포토부스 사진</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .photo-page {
      position: relative;
      max-width: 520px; margin: 0 auto;
      padding: 28px 16px calc(36px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 18px;
    }
    .photo-page header p { margin: 0 0 4px; color: var(--sail-hi); font-weight: 600; font-size: .95rem; }
    .photo-page h1 {
      margin: 0; font-family: var(--display); font-weight: 700;
      font-size: 1.85rem; letter-spacing: -.03em; line-height: 1.25;
    }
    .photo-page .shot {
      width: 100%; border-radius: 14px;
      box-shadow: 0 40px 70px -24px rgba(0, 0, 0, .75), 0 8px 20px rgba(0, 0, 0, .25);
      animation: print 1.6s var(--ease) both;
    }
    .photo-page .actions { display: grid; gap: 10px; }
    .photo-page .actions .btn { width: 100%; text-decoration: none; }
    .photo-page .tip { margin: 0; color: var(--text-dim); font-size: .9rem; text-align: center; }
    .photo-page .ver { display: flex; gap: 8px; margin-bottom: 12px; }
    .photo-page .ver button {
      flex: 1; padding: 10px 8px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .06);
      color: var(--text-dim); font: inherit; font-size: .92rem; font-weight: 600;
    }
    .photo-page .ver button[aria-pressed="true"] {
      background: var(--sail-hi); border-color: transparent; color: #11242a;
    }
    .photo-page .ver .tag { font-size: .72rem; opacity: .85; margin-left: 4px; }
    .photo-page .ai-note { margin: 10px 0 0; color: var(--text-dim); font-size: .85rem; text-align: center; }
    .photo-page .missing { padding: 40px 0; }
    .photo-page .missing p { color: var(--text-dim); }
  </style>
</head>
<body>
<div class="ambient" id="ambient" aria-hidden="true"><img alt=""></div>
<main class="photo-page" data-state="{{STATE}}" data-sid="{{SID}}">
  <header>
    <p>2026 나주영산강축제</p>
    <h1 id="title">오늘의 영산강 사진</h1>
  </header>

  <div id="ready" hidden>
    <div class="ver" id="ver" hidden role="group" aria-label="사진 고르기">
      <button type="button" data-ver="base" aria-pressed="true">기본</button>
      <button type="button" data-ver="ai" aria-pressed="false">AI 빛 보정<span class="tag">NEW</span></button>
    </div>
    <img class="shot" id="shot" alt="포토부스에서 찍은 사진">
    <p class="ai-note" id="aiNote" hidden></p>
    <div class="actions" style="margin-top:18px">
      <button class="btn btn-sail btn-lg" id="shareBtn" type="button" hidden>사진 저장·공유하기</button>
      <a class="btn btn-sail btn-lg" id="saveFinal" download>프레임 사진 저장하기</a>
      <a class="btn btn-glass" id="saveShot" download>프레임 없는 사진 저장하기</a>
    </div>
    <p class="tip" style="margin-top:14px">저장이 안 되면 사진을 길게 눌러 ‘사진 앱에 저장’을 고르세요.</p>
  </div>

  <div class="missing" id="missing" hidden>
    <p>사진을 찾을 수 없어요. 보관 기간이 지나 삭제됐거나 주소가 잘못됐어요. 부스에서 QR코드를 다시 찍어 주세요.</p>
  </div>
</main>
<script>
  const page = document.querySelector('.photo-page');
  const sid = page.dataset.sid;
  if (page.dataset.state !== 'ready' || !sid) {
    document.getElementById('missing').hidden = false;
    document.getElementById('title').textContent = '사진이 없어요';
  } else {
    const shot = document.getElementById('shot');
    const saveFinal = document.getElementById('saveFinal');
    const saveShot = document.getElementById('saveShot');
    const share = document.getElementById('shareBtn');
    const note = document.getElementById('aiNote');
    const amb = document.querySelector('#ambient img');
    // base: 부스에서 고른 사진, ai: 뒤에서 만들어진 AI 빛 보정 버전
    const urls = { base: { final: `/media/${sid}/final.jpg`, photo: `/media/${sid}/shot.jpg` } };
    let cur = 'base';
    let shareFile = null;

    document.getElementById('ready').hidden = false;
    amb.onload = () => amb.classList.add('on');

    function setVersion(v) {
      if (!urls[v]) return;
      cur = v;
      const u = urls[v];
      shot.src = u.final;
      amb.src = u.final;             // 내 사진의 빛이 화면 전체에 번지게
      saveFinal.href = `${u.final}?download=1`;
      saveShot.href = `${u.photo}?download=1`;
      note.hidden = v !== 'ai';
      document.querySelectorAll('#ver button').forEach((b) => {
        b.setAttribute('aria-pressed', String(b.dataset.ver === v));
      });
      prepareShare(u.final);
    }

    // 휴대폰에서는 공유 시트로 바로 사진 앱에 저장하거나 메신저로 보낼 수 있다
    function prepareShare(url) {
      if (!navigator.canShare) return;
      shareFile = null;
      fetch(url).then((r) => r.blob()).then((blob) => {
        const file = new File([blob], 'yeongsangang.jpg', { type: 'image/jpeg' });
        if (!navigator.canShare({ files: [file] })) return;
        shareFile = file;
        share.hidden = false;
        saveFinal.className = 'btn btn-glass';
      }).catch(() => {});
    }
    share.addEventListener('click', () => {
      if (shareFile) navigator.share({ files: [shareFile], title: '영산강 포토부스' }).catch(() => {});
    });
    document.querySelectorAll('#ver button').forEach((b) => {
      b.addEventListener('click', () => setVersion(b.dataset.ver));
    });
    setVersion('base');

    // AI 빛 보정 버전은 부스에서 사진을 받은 뒤에도 뒤에서 만들어진다. 준비되면 고르기 단추가 생긴다
    let tries = 0;
    async function pollAi() {
      if (tries++ > 40) return;                       // 2분쯤 기다리고 그만둔다
      let res;
      try {
        res = await (await fetch(`/p/${sid}/ai`, { cache: 'no-store' })).json();
      } catch { return setTimeout(pollAi, 5000); }
      if (res.state === 'pending') {
        note.textContent = 'AI 빛 보정 버전을 만들고 있어요. 잠시만요…';
        note.hidden = false;
        return setTimeout(pollAi, 3000);
      }
      if (res.state !== 'ready') return;              // off·failed면 조용히 둔다
      urls.ai = { final: res.final || res.photo, photo: res.photo };
      note.textContent = 'AI가 그곳의 빛에 맞춰 다시 비춘 사진이에요. 얼굴은 그대로예요.';
      note.hidden = cur !== 'ai';
      document.getElementById('ver').hidden = false;
    }
    pollAi();
  }
</script>
</body>
</html>
