<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1d22">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
  <title>포토부스 사진 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    /* 옆에서 볼 수도 있는 화면이라 사진은 기본으로 감춘다. '사진 보기'를 눌러야 그때 내려받는다 */
    html, body { height: auto; min-height: 100%; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 22px var(--gutter) 110px; }

    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .head h1 { margin: 0; font-size: 1.2rem; letter-spacing: -.02em; }
    .head .spacer { flex: 1; }

    .sum { color: var(--text-dim); font-size: .9rem; margin: 0 0 14px; }
    .sum b { color: var(--text); }
    .sum .load { color: var(--sail-hi); }
    .sum .warn { color: #ffb4a8; }

    #search {
      width: 100%; padding: 11px 14px; margin-bottom: 14px; border-radius: 12px;
      background: var(--glass); border: 1px solid var(--glass-line);
      color: var(--text); font: inherit; font-size: .95rem;
    }

    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .row {
      background: var(--glass); border: 1px solid var(--glass-line);
      border-radius: 14px; padding: 11px 13px;
    }
    .row .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .row .when { color: var(--text-faint); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .row .place { font-weight: 600; font-size: .94rem; }
    .row .msg {
      flex: 1; min-width: 120px; font-family: var(--hand); font-size: 1.05rem;
      color: var(--sail-hi); overflow-wrap: anywhere;
    }
    .row .tag {
      padding: 2px 8px; border-radius: 999px; font-size: .74rem; color: var(--text-faint);
      border: 1px solid var(--glass-line);
    }
    .row .tag.ai { color: var(--sail-hi); border-color: rgba(255, 210, 122, .4); }
    .row .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
    .row .acts .btn { min-height: 34px; padding: 0 11px; font-size: .85rem; border-radius: 10px; }
    .row .acts .btn.danger { color: #ffb4a8; }
    .row .peek { margin-top: 10px; }
    .row .peek img {
      max-width: 260px; width: 100%; border-radius: 10px; display: block;
    }
    .row.gone .place::after { content: ' · 삭제됨'; color: var(--text-faint); font-weight: 400; }

    .more { display: grid; place-items: center; margin-bottom: 12px; }
    .more:has([hidden]) { display: none; }

    /* 단체 묶음: 한 명씩 찍은 사진을 골라 QR 하나로 */
    .row .pick { width: 20px; height: 20px; flex: none; margin: 0; accent-color: var(--sail); cursor: pointer; }
    .row.picked { border-color: rgba(255, 210, 122, .6); background: rgba(255, 210, 122, .08); }
    .hint { margin: -4px 0 14px; color: var(--text-faint); font-size: .84rem; }
    .albums { margin: 0 0 18px; }
    .albums h2 { margin: 0 0 8px; font-size: .95rem; color: var(--text-dim); }
    .selbar {
      position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      width: min(680px, calc(100% - 24px)); padding: 10px 12px 10px 16px; border-radius: 16px;
      background: #16343c; border: 1px solid rgba(255, 210, 122, .45); box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .7);
    }
    .selbar[hidden] { display: none; }
    .selbar .spacer { flex: 1; }
    .selbar b { color: var(--sail-hi); }
    .empty { padding: 50px 0; text-align: center; color: var(--text-faint); }

    dialog {
      border: 0; border-radius: 18px; padding: 0; color: var(--text);
      background: #122a31; box-shadow: 0 40px 80px -20px rgba(0, 0, 0, .7);
      max-width: 360px; width: calc(100% - 32px);
    }
    dialog::backdrop { background: rgba(4, 12, 15, .75); }
    dialog .inner { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
    dialog h2 { margin: 0; font-size: 1.05rem; }
    dialog p { margin: 0; color: var(--text-dim); font-size: .88rem; }
    dialog input[type="password"], dialog input[type="text"] {
      padding: 12px 14px; border-radius: 12px; background: rgba(0, 0, 0, .25);
      border: 1px solid var(--glass-line); color: var(--text); font: inherit;
    }
    dialog .row2 { display: flex; gap: 8px; }
    dialog .row2 .btn { flex: 1; }
    dialog .err { color: #ffb4a8; font-size: .86rem; min-height: 1.1em; }
    dialog img.qr { width: 100%; border-radius: 12px; background: #fff; }
    dialog .link {
      font-size: .78rem; color: var(--text-faint); overflow-wrap: anywhere;
      background: rgba(0, 0, 0, .25); padding: 8px 10px; border-radius: 10px;
    }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: #16343c; border: 1px solid var(--glass-line); color: var(--text);
      padding: 11px 18px; border-radius: 999px; font-size: .9rem; z-index: 99;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>사진 관리</h1>
    <div class="spacer"></div>
    <button class="btn btn-glass btn-sm" id="refreshBtn" type="button">새로 고침</button>
    <button class="btn btn-glass btn-sm" id="lockBtn" type="button">잠그기</button>
  </div>

  <p class="sum" id="sum" hidden></p>
  <input type="search" id="search" placeholder="한마디·장소·사진 ID로 찾기" autocomplete="off" hidden>

  <p class="hint" id="pickHint" hidden>단체로 한 명씩 찍었다면 왼쪽 네모를 골라 QR 하나로 묶을 수 있어요. Shift를 누른 채 고르면 그 사이를 한꺼번에 골라요. 목록은 찍은 순서대로예요 (맨 아래가 가장 최근).</p>

  <section class="albums" id="albums" hidden>
    <h2>단체 묶음 QR</h2>
    <ul class="list" id="albumList"></ul>
  </section>

  <div class="more"><button class="btn btn-glass" id="moreBtn" type="button" hidden>↑ 앞선 사진 더 보기</button></div>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>아직 완성된 사진이 없어요.</p>
</div>

<div class="selbar" id="selbar" hidden>
  <span><b id="selCount">0</b>장 골랐어요</span>
  <span class="spacer"></span>
  <button class="btn btn-glass btn-sm" id="selClear" type="button">선택 해제</button>
  <button class="btn btn-sail btn-sm" id="selMake" type="button">묶어서 QR 만들기</button>
</div>

<dialog id="albumDlg">
  <form class="inner" id="albumForm">
    <h2>QR 하나로 묶기</h2>
    <p id="albumWhat"></p>
    <input type="text" id="albumTitle" maxlength="30" placeholder="이름 (선택, 예: 3학년 2반)" autocomplete="off">
    <p class="err" id="albumErr"></p>
    <div class="row2">
      <button class="btn btn-glass btn-sm" id="albumCancel" type="button">취소</button>
      <button class="btn btn-sail btn-sm" id="albumMake" type="submit">만들기</button>
    </div>
  </form>
</dialog>

<dialog id="loginDlg">
  <form class="inner" id="loginForm">
    <h2>관리 비밀번호</h2>
    <p>완성된 사진 이력을 보고 다시 보내는 화면이에요.</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" required>
    <p class="err" id="loginErr"></p>
    <button class="btn btn-sail btn-lg" id="loginBtn" type="submit">들어가기</button>
  </form>
</dialog>

<dialog id="qrDlg">
  <div class="inner">
    <h2 id="qrTitle">사진 받기 QR</h2>
    <p id="qrWhen"></p>
    <img class="qr" id="qrImg" alt="사진 받기 QR코드">
    <p class="link" id="qrLink"></p>
    <div class="row2">
      <button class="btn btn-glass btn-sm" id="qrCopy" type="button">링크 복사</button>
      <button class="btn btn-glass btn-sm" id="qrClose" type="button">닫기</button>
    </div>
  </div>
</dialog>

<script>
  const $ = (s) => document.querySelector(s);
  const PAGE = 30;
  const state = { offset: 0, total: 0, q: '' };
  let cur = null;

  function toast(msg) {
    document.querySelector('.toast')?.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  async function api(url, opts) {
    const res = await fetch(url, { cache: 'no-store', ...opts });
    if (res.status === 401) { openLogin(); throw new Error('401'); }
    if (!res.ok) {
      let msg = '서버와 연결이 고르지 않아요.';
      try { msg = (await res.json()).detail || msg; } catch { /* 본문 없음 */ }
      throw new Error(msg);
    }
    return res.json();
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function fmtWhen(t) {
    const d = new Date(t * 1000);
    const two = (n) => String(n).padStart(2, '0');
    return `${two(d.getMonth() + 1)}.${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`;
  }

  /* ---------- 들어가기 ---------- */
  function openLogin() {
    hideAll();
    const d = $('#loginDlg');
    if (!d.open) d.showModal();
    $('#pw').focus();
  }

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#loginBtn').disabled = true;
    try {
      // 틀린 횟수·정지 안내를 서버가 알려 주므로 그대로 보여 준다
      const res = await fetch('/api/manage/login', {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: $('#pw').value }),
      });
      if (!res.ok) {
        let msg = '비밀번호가 달라요.';
        try { msg = (await res.json()).detail || msg; } catch { /* 본문 없음 */ }
        throw new Error(msg);
      }
      $('#loginErr').textContent = '';
      $('#pw').value = '';
      $('#loginDlg').close();
      reload();
    } catch (err) {
      $('#loginErr').textContent = err.message;
      $('#pw').select();
    } finally {
      $('#loginBtn').disabled = false;
    }
  });

  $('#lockBtn').addEventListener('click', async () => {
    await fetch('/api/manage/logout', { method: 'POST' });
    $('#list').innerHTML = '';
    $('#albumList').innerHTML = '';
    $('#sum').hidden = $('#search').hidden = $('#pickHint').hidden = $('#albums').hidden = true;
    sel.clear();
    syncSel();
    openLogin();
  });

  /* ---------- 사진 가리기 ---------- */
  // 사진은 눌렀을 때만 내려받아 보여 준다. 다른 사람이 화면을 봐도 사진이 떠 있지 않도록
  function hideAll() {
    document.querySelectorAll('.row .peek').forEach((p) => {
      p.hidden = true;
      p.querySelector('img')?.removeAttribute('src');
    });
    document.querySelectorAll('[data-act="peek"]').forEach((b) => { b.textContent = '사진 보기'; });
  }

  function togglePeek(it, row, btn) {
    const peek = row.querySelector('.peek');
    const img = peek.querySelector('img');
    const show = peek.hidden;
    hideAll();
    if (!show) return;
    img.src = it.final;
    peek.hidden = false;
    btn.textContent = '사진 가리기';
  }

  /* ---------- 요약 ---------- */
  async function loadStatus() {
    const s = await api('/api/manage/status');
    const ai = s.ai.engine === 'off' ? 'AI 꺼짐' : `AI 대기 ${s.ai.waiting}${s.ai.running ? '+1' : ''}`;
    // GPT 효과: 오늘 만든 장수와 실제 사용 토큰으로 셈한 금액 (1달러 = 1,400원으로 어림)
    const gpt = s.gpt && s.gpt.on
      ? ` · GPT 오늘 <b>${s.gpt.today}</b>/${s.gpt.limit}장 $${s.gpt.cost.toFixed(2)} (약 ${Math.round(s.gpt.cost * 1400).toLocaleString()}원)`
      : s.gpt && s.gpt.keyRejected
        ? ' · <b class="warn">GPT 키가 거절됨: 새 키를 .env에 넣고 부스를 다시 켜 주세요 (그때까지 AI 효과 버튼 숨김)</b>'
        : '';
    $('#sum').innerHTML = `전체 <b>${s.total}</b>장 · 오늘 <b>${s.today}</b>장`
      + ` · <span class="load">합성 ${s.compose.busy}/${s.compose.slots} · ${ai}</span>${gpt}`;
    $('#sum').hidden = false;
    $('#search').hidden = false;
    $('#pickHint').hidden = false;
  }

  /* ---------- 목록 ---------- */
  function row(it) {
    const el = document.createElement('li');
    el.className = 'row' + (it.alive ? '' : ' gone');
    el.dataset.id = it.id;
    el.innerHTML = `
      <div class="top">
        ${it.alive ? '<input type="checkbox" class="pick" aria-label="단체 묶음에 넣기">' : ''}
        <span class="when">${fmtWhen(it.t)}</span>
        <span class="place">${esc(it.place || '장소 미상')}</span>
        <span class="msg">${esc(it.msg || '')}</span>
        ${it.ai ? '<span class="tag ai">AI</span>' : ''}
        ${it.filter === null ? '<span class="tag">기록 없음</span>' : ''}
        <span class="acts">
          ${it.alive ? '<button class="btn btn-glass" data-act="peek" type="button">사진 보기</button>' : ''}
          ${it.alive ? '<button class="btn btn-glass" data-act="qr" type="button">QR·링크</button>' : ''}
          <button class="btn btn-glass danger" data-act="del" type="button">삭제</button>
        </span>
      </div>
      <div class="peek" hidden><img alt="완성된 사진"></div>`;
    el.querySelector('[data-act="peek"]')?.addEventListener('click', (e) => togglePeek(it, el, e.currentTarget));
    el.querySelector('[data-act="qr"]')?.addEventListener('click', () => openQr(it));
    el.querySelector('[data-act="del"]').addEventListener('click', () => remove(it, el));
    const cb = el.querySelector('.pick');
    cb?.addEventListener('click', (e) => pick(it, el, cb.checked, e.shiftKey));
    return el;
  }

  // 목록은 찍은 순서대로 (위가 먼저, 맨 아래가 가장 최근). 서버는 최근 것부터 한 쪽씩 주므로 뒤집어 쓰고,
  // '앞선 사진 더 보기'는 그보다 이전 쪽을 목록 위에 덧붙인다. 보고 있던 줄은 제자리에 둔다
  async function loadPage(reset) {
    if (reset) state.offset = 0;
    const res = await api(`/api/manage/shots?offset=${state.offset}&limit=${PAGE}&q=${encodeURIComponent(state.q)}`);
    state.total = res.total;
    const have = new Set(reset ? [] : [...$('#list').children].map((r) => r.dataset.id));
    const rows = res.items.filter((it) => !have.has(it.id)).reverse().map(row);
    if (reset) {
      $('#list').replaceChildren(...rows);
    } else {
      const first = $('#list').firstElementChild;
      const top = first?.getBoundingClientRect().top;
      $('#list').prepend(...rows);
      if (first) scrollBy(0, first.getBoundingClientRect().top - top);
    }
    syncSel();  // 찾기·더 보기 뒤에도 고른 표시가 남게
    state.offset += res.items.length;
    $('#empty').hidden = state.total > 0;
    $('#moreBtn').hidden = state.offset >= state.total;
  }

  async function reload() {
    try {
      await loadStatus();
      await loadPage(true);
      await loadAlbums();
      scrollTo(0, document.documentElement.scrollHeight);  // 가장 최근 사진(맨 아래)이 바로 보이게
    } catch (e) {
      if (e.message !== '401') toast(e.message);
    }
  }

  /* ---------- QR·링크 ---------- */
  function openQr(it, title = '사진 받기 QR', when = `${fmtWhen(it.t)} · ${it.place || ''}`) {
    cur = it;
    hideAll();  // QR만 보이게 (사진은 가린 채로)
    $('#qrTitle').textContent = title;
    $('#qrWhen').textContent = when;
    $('#qrImg').src = it.qr;
    $('#qrLink').textContent = it.page;
    $('#qrDlg').showModal();
  }
  $('#qrClose').addEventListener('click', () => $('#qrDlg').close());
  $('#qrCopy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(cur.page);
      toast('링크를 복사했어요.');
    } catch {
      toast('복사가 안 돼요. 주소를 직접 선택해 주세요.');
    }
  });

  /* ---------- 단체 묶음 ---------- */
  // 단체로 와서 한 명씩 찍은 사진을 골라 QR 하나로 모두 받게 한다. 찍은 순서대로 담긴다
  const sel = new Set();
  let lastPick = null;  // Shift로 사이를 한꺼번에 고를 때 기준

  function syncSel() {
    $('#selCount').textContent = sel.size;
    $('#selbar').hidden = sel.size === 0;
    document.querySelectorAll('#list .row').forEach((r) => {
      const on = sel.has(r.dataset.id);
      r.classList.toggle('picked', on);
      const cb = r.querySelector('.pick');
      if (cb) cb.checked = on;
    });
  }

  function pick(it, el, on, shift) {
    const rows = [...document.querySelectorAll('#list .row')];
    const a = shift && lastPick ? rows.findIndex((r) => r.dataset.id === lastPick) : -1;
    const targets = a >= 0
      ? rows.slice(Math.min(a, rows.indexOf(el)), Math.max(a, rows.indexOf(el)) + 1).filter((r) => r.querySelector('.pick'))
      : [el];
    targets.forEach((r) => (on ? sel.add(r.dataset.id) : sel.delete(r.dataset.id)));
    lastPick = it.id;
    syncSel();
  }

  function openAlbumQr(a) {
    openQr(a, `단체 사진 QR · ${a.count}장`, `${fmtWhen(a.t)} · ${a.title || '이름 없는 묶음'}`);
  }

  async function loadAlbums() {
    const res = await api('/api/manage/albums');
    $('#albumList').replaceChildren(...res.items.map((a) => {
      const li = document.createElement('li');
      li.className = 'row';
      li.innerHTML = `
        <div class="top">
          <span class="when">${fmtWhen(a.t)}</span>
          <span class="place">${esc(a.title || '이름 없는 묶음')}</span>
          <span class="tag">${a.count}장</span>
          <span class="acts">
            <button class="btn btn-glass" data-act="qr" type="button">QR·링크</button>
            <button class="btn btn-glass danger" data-act="del" type="button">묶음 삭제</button>
          </span>
        </div>`;
      li.querySelector('[data-act="qr"]').addEventListener('click', () => openAlbumQr(a));
      li.querySelector('[data-act="del"]').addEventListener('click', async () => {
        if (!confirm(`'${a.title || '이름 없는 묶음'}' 묶음을 지울까요? 사진은 그대로 남고, 이 묶음 QR만 열리지 않게 돼요.`)) return;
        try {
          await api(`/api/manage/albums/${a.id}`, { method: 'DELETE' });
          li.remove();
          $('#albums').hidden = !$('#albumList').children.length;
          toast('묶음을 지웠어요.');
        } catch (e) {
          if (e.message !== '401') toast(e.message);
        }
      });
      return li;
    }));
    $('#albums').hidden = !res.items.length;
  }

  $('#selClear').addEventListener('click', () => { sel.clear(); lastPick = null; syncSel(); });
  $('#selMake').addEventListener('click', () => {
    $('#albumWhat').textContent = `고른 사진 ${sel.size}장을 찍은 순서대로 QR 하나에 담아요. 이름은 받는 화면의 제목으로도 보여요.`;
    $('#albumErr').textContent = '';
    $('#albumDlg').showModal();
    $('#albumTitle').focus();
  });
  $('#albumCancel').addEventListener('click', () => $('#albumDlg').close());
  $('#albumForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#albumMake');
    btn.disabled = true;
    try {
      const a = await api('/api/manage/albums', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [...sel], title: $('#albumTitle').value }),
      });
      $('#albumDlg').close();
      $('#albumTitle').value = '';
      sel.clear();
      lastPick = null;
      syncSel();
      openAlbumQr(a);
      loadAlbums().catch(() => {});
    } catch (err) {
      if (err.message !== '401') $('#albumErr').textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  /* ---------- 삭제 ---------- */
  async function remove(it, el) {
    if (!confirm(`${fmtWhen(it.t)} 사진을 지울까요? 되돌릴 수 없고, 방문객의 받기 링크도 열리지 않게 됩니다.`)) return;
    try {
      await api(`/api/manage/shots/${it.id}`, { method: 'DELETE' });
      el.remove();
      state.offset = Math.max(0, state.offset - 1);
      sel.delete(it.id);
      syncSel();
      toast('지웠어요.');
      loadStatus().catch(() => {});
    } catch (e) {
      if (e.message !== '401') toast(e.message);
    }
  }

  /* ---------- 연결 ---------- */
  $('#refreshBtn').addEventListener('click', reload);
  $('#moreBtn').addEventListener('click', () => loadPage(false).catch(() => {}));
  let findTimer = 0;
  $('#search').addEventListener('input', () => {
    clearTimeout(findTimer);
    findTimer = setTimeout(() => { state.q = $('#search').value; loadPage(true).catch(() => {}); }, 350);
  });
  // 다른 화면으로 넘어가면 사진을 다시 가린다
  addEventListener('blur', hideAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) hideAll(); });
  setInterval(() => { if (!$('#sum').hidden) loadStatus().catch(() => {}); }, 10000);

  reload();
</script>
</body>
</html>
