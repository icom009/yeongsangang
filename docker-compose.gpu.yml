# GPU(NVIDIA) 서버용 덧붙임. 집 컴퓨터(RTX)에서만 쓴다. 현장 노트북(플랜 B)은 이 파일 없이 CPU로 돈다.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile web up -d --build
# .env에 COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml 를 넣어 두면 -f 없이 그대로 쓸 수 있다
services:
  booth:
    build:
      args:
        ORT: onnxruntime-gpu[cuda,cudnn]
        MATTING: resnet50
        SEGMENT: birefnet
    image: yeongsangang-booth:gpu
    environment:
      YS_DEVICE: ${YS_DEVICE:-auto}
      YS_MATTING_SIZE: ${YS_MATTING_SIZE:-640}
      YS_COMPOSE_SLOTS: ${YS_COMPOSE_SLOTS:-3}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 밤마다(기본 05:00) 부스·IC-Light를 다시 띄워 오래 켜 둔 프로세스의 메모리를 비운다 (scripts/nightly-restart.sh).
  # 도커 소켓을 쓰므로 이 컴퓨터 안에서만 돈다 (포트 없음)
  restarter:
    image: docker:cli
    profiles: ["web"]
    restart: unless-stopped
    command: sh /restart.sh
    environment:
      YS_RESTART_AT: ${YS_RESTART_AT:-05:00}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/nightly-restart.sh:/restart.sh:ro
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
