# 영산강 포토부스 실행
#
# 플랜 A (집 컴퓨터 서버 + 인터넷 https 주소). 둘 중 하나:
#   cp .env.example .env        # 도메인, 부스 키 (터널이면 터널 토큰도) 채우기
#   A-1 Cloudflare Tunnel:  docker compose --profile online up -d --build
#   A-2 포트포워딩 + Caddy:  docker compose --profile web up -d --build
#       (공유기에서 TCP 80·443(+UDP 443)을 이 컴퓨터 내부 IP로 포워딩, 도메인 A 레코드 = 집 공인 IP)
#   부스 기기에서 https://<도메인>/?key=<부스 키> 를 한 번 열면 그 기기는 계속 촬영 화면을 쓸 수 있다
#
# 플랜 B (현장 노트북 + 공유기, 인터넷 없이 로컬만)
#   cp .env.local.example .env.local   # 노트북의 공유기 내부 IP 채우기
#   docker compose --env-file .env.local up -d
#   부스 화면은 그 노트북 브라우저에서 http://localhost:8080
#   방문객은 같은 공유기 Wi-Fi에 붙어 QR을 연다 (현장에서 받아 가야 한다)
#
# 이미지는 인터넷이 되는 곳에서 미리 빌드해 둘 것 (모델·미리보기 파일을 빌드 때 내려받는다)
# 로그는 서비스마다 20MB x 5개까지만 남긴다 (축제 내내 쌓여 디스크를 채우지 않게)
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  booth:
    build: .
    image: yeongsangang-booth
    restart: unless-stopped
    ports:
      # 플랜 B(현장 노트북)는 같은 공유기의 기기가 8080으로 들어와야 하므로 기본은 모든 주소.
      # 도메인(Caddy)으로만 쓰는 서버는 .env에 YS_BIND=127.0.0.1 을 넣어 이 컴퓨터 안에서만 열어 둔다
      # (안 그러면 공유기가 8080을 넘길 때 Caddy·https를 건너뛰고 부스에 바로 닿는다)
      - "${YS_BIND:-0.0.0.0}:8080:8080"
    environment:
      YS_PUBLIC_URL: ${YS_PUBLIC_URL:-}
      YS_BOOTH_KEY: ${YS_BOOTH_KEY:-}
      YS_OPEN: ${YS_OPEN:-}
      YS_KEEP_HOURS: ${YS_KEEP_HOURS:-168}
      YS_BEAUTY: ${YS_BEAUTY:-1}
      # 생성형 AI 빛 보정: auto면 로컬 IC-Light(docker-compose.ai.yml) → 외부 API 키 → 끔
      YS_AI: ${YS_AI:-auto}
      YS_AI_KEY: ${YS_AI_KEY:-}
      # 휴대폰 'AI로 바꿔 보기' 버튼(GPT 이미지 편집, 유료). 키가 없으면 버튼이 안 보인다
      YS_OPENAI_KEY: ${YS_OPENAI_KEY:-}
      OPENAI_KEY: ${OPENAI_KEY:-}            # 같은 키를 이 이름으로 넣어도 된다
      YS_GPT_MODEL: ${YS_GPT_MODEL:-}
      YS_GPT_QUALITY: ${YS_GPT_QUALITY:-}
      YS_GPT_DAILY: ${YS_GPT_DAILY:-}
      # 관리 화면(/manage) 비밀번호와 메일 재전송 설정
      YS_MANAGE_KEY: ${YS_MANAGE_KEY:-}
      YS_SMTP_HOST: ${YS_SMTP_HOST:-}
      YS_SMTP_PORT: ${YS_SMTP_PORT:-587}
      YS_SMTP_USER: ${YS_SMTP_USER:-}
      YS_SMTP_PASS: ${YS_SMTP_PASS:-}
      YS_SMTP_FROM: ${YS_SMTP_FROM:-}
    volumes:
      - ./output:/app/output   # 사진은 컨테이너를 지워도 남도록 이 폴더에 저장
    logging: *logging
    # 응답이 없으면 docker ps에 unhealthy로 보인다 (모델을 올리는 처음 1~2분은 봐준다)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/config', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["online"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    logging: *logging
    depends_on:
      - booth

  caddy:
    image: caddy:2
    profiles: ["web"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      YS_DOMAIN: ${YS_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # 발급받은 인증서 (지우면 다시 발급, 너무 자주면 발급 제한에 걸린다)
      - caddy_config:/config
    logging: *logging
    depends_on:
      - booth

volumes:
  caddy_data:
  caddy_config:
